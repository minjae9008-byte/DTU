[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dtu"
version = "1.0.0"
description = "DVD to HD remastering: deinterlace/IVTC, denoise, upscale, frame interpolation, VobSub->PGS subtitle upscaling and audio enhancement with FFmpeg (no AI models)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest", "pillow"]
dnd = ["tkinterdnd2"]

[project.scripts]
dtu = "dtu.cli:main"

[project.gui-scripts]
dtu-gui = "dtu.gui:main"

[tool.setuptools]
packages = ["dtu", "dtu.subtitles"]
